name = "group-dimension"
version = "0.1.0"
keywords = ["mathematics", "group-theory", "dimension-subgroups"]
defaultTargets = ["GroupDimension", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "GroupDimension"

# Palomar submission (palomar/README.md): the Mathlib-only statements and their proofs.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
