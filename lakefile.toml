name = "group-dimension"
version = "0.1.0"
keywords = ["mathematics", "group-theory", "dimension-subgroups"]
defaultTargets = ["GroupDimension", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "GroupDimension"

# Palomar submission (palomar/README.md): the Mathlib-only statements and their proofs.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# D5-34: the certificate checker of Prop. 5.3 (core Lean only), compiled to native code so that
# `native_decide` in `GroupDimension/Cert1024/Data` runs it natively.
[[lean_lib]]
name = "Cert1024Comp"
precompileModules = true

# MATH-314: kernel checks of the polynomial-map part of the weight >= 2 membership claims (generated by
# `GroupDimension/TraceReplay/poly_to_lean.py`). Not a default target: `lake build PolyData`.
[[lean_lib]]
name = "PolyData"
globs = ["PolyData.+"]
