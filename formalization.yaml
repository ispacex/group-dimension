status:
  scope: >-
    The compared theorems are proved without sorry and use only propext, Classical.choice and
    Quot.sound. Not formalized: the general Jennings theorem (only the inclusion needed for D_5
    is); the paper's computer results (Propositions 5.1, 5.3, 5.10, Theorems 5.4, 6.19), of
    which Proposition 5.3 enters D_five_eq_bot_of_rank as an explicit hypothesis; the classical
    result Gupta–Tahara's D_{p+2} = γ_{p+2} for metabelian p-groups, p odd [GT85, Thm.
    3.2(c)], for p ≥ 5 (at p = 3 it is the paper's Theorem D.1, compared here),
    which enters Lemma 6.1 for general odd p as an explicit hypothesis (Lemma 6.2, a p = 3
    statement, and Lemma 6.1 at p = 3 are formalized without it); Lemma C.1 (that nonterminal means a nontrivial nucleus). Formalized in
    the development but not compared here: Remark 2.2, Lemma 5.2 (d), Proposition 5.8, Lemma 5.9, Lemma 6.1
    (with Gupta–Tahara as an explicit hypothesis, and for p = 3 without it), Lemma 6.2, Lemma
    6.3, Proposition 6.5, Lemma 6.14 (for quotients E/U of any group E), Theorem 6.15 (for
    central extensions by a subgroup of exponent p, since Mathlib has no p-covering group),
    Theorem 6.17 in both directions for a given normal form u, v, w, x_i and exponents (N1 and N3
    enter through it, N2 as a hypothesis of the sufficiency; nonterminal taken as in Lemma C.1: a
    central extension by a subgroup of order p with γ_4 ≠ 1; for the sufficiency and the
    equivalence P is in Type), the Lie algebra of Appendix A (Remark 6.4(2), over any field),
    the inclusion part of Tahara's Theorem 6.1, and the exact identity (⋆) of the proof of
    Theorem 6.11 without any condition on γ_4 (Star.two_smul_gen_eq, used for the result for
    Q/γ_2(Q) ≅ C_3 × C_9 × C_9, which is not in the paper). Not formalized either: the general
    form D_5(G) = γ_5(G) whenever G/γ_2(G) ≅ C_3 × C_9 × C_9 (only the finite form of class
    ≤ 4 is compared).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agents wrote all Lean code (definitions, statements and proofs) and the
        Challenge/Solution pair, except the proofs of the theorem on Q/γ_2(Q) ≅ C_3 × C_9 × C_9
        (GroupDimension/Star.lean, GroupDimension/Star/, Ab399.lean, Ab399Finite.lean), which
        were written by Kimi K3.1 Pro agents (next entry) against statements and a skeleton
        fixed by a Claude Code agent, and later edited in review by Claude Code agents. All of
        it was done under the direction of Stanislav Vorobev, who chose the results and tracked
        the work in an issue tracker. Lean builds ran on a separate build machine through a job
        runner. The port from Lean 4.29 to Lean 4.35 with the module system was also done by a
        Claude Code agent.
      cost:
        wall_time: "about one week (2026-10-16 to 2026-10-23), plus later additions to 2026-11-12"
        spend_usd: "subscription-based usage; not itemized"
        hardware: "API-only for the agents; a 10-core build server for Lean"
      prompting_notes: >-
        Agents were given tasks of the form "formalize Lemma X of the paper", with the
        paper source and the existing development, and were required to keep an axiom
        audit (#print axioms for every declaration) free of anything beyond the three
        standard axioms.
    - method: agent
      models: ["moonshotai/kimi-k3.1-pro"]
      framework: "Open Math OS"
      tool_setup: >-
        For the result for Q/γ_2(Q) ≅ C_3 × C_9 × C_9 (2026-11-12) the Lean proofs of the exact
        identity (⋆) (GroupDimension/Star), of the vanishing of its terms (Ab399.lean) and of the
        finite theorem (Ab399Finite.lean) were written by Kimi K3.1 Pro agents in Open Math OS
        virtual machines, against statements and a skeleton fixed by a Claude Code agent, which
        did not let the model change them. Every answer was checked by a build on the separate
        build machine. The model GLM 5.3 was tried on two of the lemmas and did not complete them.
      cost:
        wall_time: "about four hours (2026-11-12)"
        spend_usd: "subscription-based usage; not itemized"
        hardware: "API-only for the agents; a 10-core build server for Lean"
  spend_usd: "subscription-based usage; not itemized"
  notes: >-
    The Lean code is AI-written. The human author directed the work and is responsible for
    it, but did not write or line-by-line review the Lean proofs. Correctness rests on the
    Lean kernel; faithfulness of the statements rests on the agent reviews described under
    review.

fidelity:
  divergences: >-
    (1) D_n is stated in the Challenge as a set; the development defines it as a normal
    subgroup, and Solution.lean proves they agree. (2) M_n in a candidate is defined by
    Jennings' product formula, not as G ∩ (1 + Δ_{F_2}(G)^n); the inclusion
    G ∩ (1 + Δ_{F_2}(G)^5) ⊆ M_5 (class ≤ 3) is proved, the reverse is not. Hence the
    non-existence results for candidates (Lemma 5.6, Proposition 5.7) are at least as strong
    as the paper's. Lemma 5.2 (b) gives n ∈ M_5 in the product sense together with
    D_5(Q) = ⟨n⟩; the paper's n ∈ Q ∩ (1 + Δ_{F_2}(Q)^5) follows from n ∈ D_5(Q), because
    Z[Q] → F_2[Q] maps Δ(Q)^5 into Δ_{F_2}(Q)^5 (the paper's own proof of (b)), so no
    direction of Jennings' theorem is needed for it. (3) Proposition 2.1 is stated with
    "metabelian" omitted, which is automatic for class ≤ 3 (Remark 2.2, metabelian_of_class_three). (4) Lemma 5.2 is compared in
    parts (a)-(c); part (d) is formalized as isDescendant_of_minimal but not
    compared. (5) The D_5 form of Proposition 5.7 assumes
    the order-2^10 statement of Proposition 5.3 for class ≤ 3 (class exactly 3
    is the paper's Proposition 5.3, computer-assisted; [computer + paper] in the cited version; class ≤ 2 follows from D_3 = γ_3, proved in the development). (6) In Lemma 5.6 the isomorphism Q/P_3(Q) ≅ Z/4 × (Z/2)^7 is given as a
    surjective homomorphism with kernel P_3(Q). (7) In Theorem 6.8 "the cubes of G/γ_2 form
    a cyclic group" is stated as: for some t, every x^3 is congruent modulo γ_2 to a power
    of t^3. (8) In Theorem 6.9 "γ_2(G)/γ_3(G) has exponent at most 3" is stated as: a^3 ∈ γ_3(G)
    for every a ∈ γ_2(G) (the development also proves the form with [x^3, y] ∈ γ_3(G),
    D_five_eq_gamma_five_of_comm_cube); "G/γ_2(G) is a finite 3-group" as: G/γ_2(G) is finite
    and every x^(3^k) lies in γ_2(G) for some k. (9) In Theorem 6.10 the paper's γ_4(G)^3 ⊆ γ_5(G)
    and γ_2(G)^9 ⊆ γ_4(G) are stated elementwise: c^3 ∈ γ_5(G) for every c ∈ γ_4(G), and
    a^9 ∈ γ_4(G) for every a ∈ γ_2(G) (equivalent, since γ_5(G) and γ_4(G) are subgroups);
    "G/γ_2(G) is a finite 3-group" as in (8). (10) In Theorem D.1 "[γ_2(G), γ_2(G)] ⊆ γ_5(G)"
    is stated elementwise ([a, b] ∈ γ_5(G) for a, b ∈ γ_2(G)) and "p an odd prime" as p.Prime
    and p ≠ 2; its "in particular" (Gupta–Tahara at p = 3) is compared separately, for finite
    G with IsPGroup 3 G and derivedSeries G 2 = ⊥. (11) In Theorem 6.11 γ_4(G)^3 ⊆ γ_5(G) is
    stated elementwise as in (9), and "G/γ_2(G) is a finite 3-group" as in (8); Theorem 6.10 is
    now derived from it in the development. (12) D_five_eq_bot_of_class_four_ab399 is not a
    statement of the paper, and the paper is not being changed: it is the theorem of the
    author's notes (see sources), "Q a finite 3-group of class ≤ 4 with Q_ab ≅ C_3 × C_9 × C_9
    ⇒ D_5(Q) = 1". In Lean, class ≤ 4 is γ_5(Q) = ⊥ (lowerCentralSeries 4 = ⊥), and
    Q_ab ≅ C_3 × C_9 × C_9 is a multiplicative isomorphism from Q/γ_2(Q) to
    Multiplicative (ZMod 3 × ZMod 9 × ZMod 9). "Q a 3-group" is not assumed, since it follows (a
    finite nilpotent group whose abelianization is a 3-group is a 3-group); there is no condition
    on γ_4(Q), as in the notes. Only this finite form is compared; the general form of the notes,
    D_5(G) = γ_5(G) whenever G/γ_2(G) ≅ C_3 × C_9 × C_9, is not formalized.

review:
  status: "agent-reviewed"
  reviewers: ["independent Claude Code reviewer agents (one per change), not human experts"]
  notes: >-
    Every change to the development was reviewed before merging by a separate agent, given the
    diff, the paper and the sources but not the author agent's notes, checking the statements
    against the paper and the cited sources (for
    example Tahara's condition (C_2) against Tahara 1981, p. 160). An axiom audit
    (AxiomAudit.lean, run in CI) prints the axioms of every declaration of the development;
    all depend only on propext, Classical.choice and Quot.sound. No human expert has
    reviewed the Lean code.

