      module: "Challenge"
      status: "proved"
    - source: "Theorem 6.8"
      lean: "GroupDimension.Palomar.D_five_eq_gamma_five_of_cubes_cyclic"
      module: "Challenge"
      status: "proved"
    - source: "Jennings' inclusion D_5 ⊆ M_5 (finite 2-groups of class ≤ 3)"
      lean: "GroupDimension.Palomar.D_five_le_jennings"
      module: "Challenge"
      status: "proved"
    - source: "Lemma 5.6"
      lean: "GroupDimension.Palomar.not_isCandidate_of_quotient_z4"
      module: "Challenge"
      status: "proved"
    - source: "Proposition 5.7 (|P_2| ≥ 16 for every candidate)"
      lean: "GroupDimension.Palomar.false_of_card_expCentral_two_le"
      module: "Challenge"
      status: "proved"
    - source: "Proposition 5.7 (candidate form)"
      lean: "GroupDimension.Palomar.not_isCandidate_of_rank"
      module: "Challenge"
      status: "proved"
    - source: "Proposition 2.1, (1) ⇔ (3)"
      lean: "GroupDimension.Palomar.dimensionQuestion5_iff_class_three"
      module: "Challenge"
      status: "proved, conditional"
      note: "Hypotheses: D_3 = γ_3, Passi, Gruenberg; without 'metabelian'."
    - source: "Lemma 5.2 (a)-(c)"
      lean: "GroupDimension.Palomar.isCandidate_of_minimal"
      module: "Challenge"
      status: "proved, conditional"
