      assigned when this commit was made. That version marks each statement [paper], [Lean]
      or [computer], and its formalization section describes this repository at commit
      e58aa2b (tag lean-v4.29, Lean 4.29). The theorem and section numbers cited in this file are those of the current draft
      (ispacex/mikh, 2026-11-07 or later, where Theorems 6.9, 6.10 and 6.11 (with Corollary 6.12
      and Remark 6.13) were added and the later statements of Section 6 were renumbered); the
      version of 2026-10-22 has none of Theorems 6.9, 6.10, 6.11 and Appendix D (Theorem D.1,
      also added on 2026-11-07). Drafts from
      2026-10-25 on replace the markers by
      conventional wording: computer-assisted results are labelled so, and a result proved by hand that is
      also formally verified says so at its proof, with the formal versions and their exact
      hypotheses in the section on the formalization; that section now describes the Lean 4.35
      port. The statement-by-statement status, with the declarations of this repository that
      state or prove each labelled statement, is the blueprint at
      https://ispacex.github.io/d5/blueprint.html (built from the paper and
      site/blueprint.toml of ispacex/dimension-subrings, whose CI checks that every declaration
      named exists here). Since e58aa2b the Lie-ring comparison theorem lieDimensionQuestion5
      has been removed (see related_formalizations). Departures from the paper are listed
      under fidelity.
    author_endorsement: participated
  - title: "S. A. Jennings, The structure of the group ring of a p-group over a modular field, Trans. Amer. Math. Soc. 50 (1941) 175-185"
    authors: ["S. A. Jennings"]
    type: paper
    relationship: adapts
    note: >-
      D_five_le_jennings states D_5(G) ⊆ ∏_{i 2^j ≥ 5} γ_i(G)^{2^j} for finite 2-groups of
      class at most 3. The development proves it from the case p = 2, n = 5, class at most 3
      of the inclusion G ∩ (1 + Δ_{F_p}(G)^n) ⊆ ∏_{i p^j ≥ n} γ_i(G)^{p^j} of Jennings' theorem
