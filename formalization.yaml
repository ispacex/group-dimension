# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Fifth dimension subgroups: D₅ = γ₅ when G/γ₂ is finite of exponent 3, candidates for a counterexample, and a reduction of Kourovka 20.84"
  description: >-
    Lean 4 / Mathlib formalization accompanying S. Vorobev, "On the inclusion
    D_5(G) ⊆ γ_4(G): reductions, the Lie-ring proof, and evidence" (preprint, 2026;
    submitted to arXiv math.GR on 2026-10-22). The integral dimension subgroups
    D_n(G) = {g ∈ G : g − 1 ∈ Δ(G)^n} are defined from the augmentation ideal of Mathlib's
    integral group ring. Kourovka Problem 20.84 asks whether D_5(G) ⊆ γ_4(G) for every group;
    it is open and is not claimed here. Unconditional results: D_5(G) = γ_5(G) whenever
    G/γ_2(G) is finite of exponent 3, and more generally whenever G/γ_2(G) is a finite
    3-group whose cubes form a cyclic group, and still more generally whenever G/γ_2(G) is a
    finite 3-group and γ_2(G)/γ_3(G) has exponent at most 3, and still more generally whenever
    G/γ_2(G) is a finite 3-group, γ_4(G)^3 ⊆ γ_5(G) and γ_2(G)^9 ⊆ γ_4(G), and most generally
    whenever G/γ_2(G) is a finite 3-group and γ_4(G)^3 ⊆ γ_5(G) (paper, Theorems 6.6, 6.8,
    6.9, 6.10 and 6.11), and whenever G/γ_2(G) is a finite p-group, p odd, and
    [γ_2(G), γ_2(G)] ⊆ γ_5(G), in particular for finite metabelian 3-groups, which is
    Gupta–Tahara's theorem at p = 3 (paper, Theorem D.1; the inclusion part
    of Tahara's 1981 description of D_5 is formalized for this); D_5(G) lies in the Jennings
    product M_5(G) for finite 2-groups of class at most 3; and, for "candidates" (the
    paper's minimal-counterexample shape among finite 2-groups of class 3), there is no
    candidate of order 2^11 with Q/P_3 ≅ Z/4 × (Z/2)^7 and none of order 2^11 and rank at
    least 8 (paper, Lemma 5.6 and Proposition 5.7); the reduction of Problem 20.84 to finite
    2-groups of class exactly 3 (Proposition 2.1); and a minimal counterexample is a candidate
    (Lemma 5.2). The proofs of the last two use D_3 = γ_3, Passi's D_4^2 ⊆ γ_4 and Gruenberg's
    residual theorem, all proved in the development (dThreeEqGammaThree, passiDFourSquare,
    gruenbergResidualTwo). One conditional result, with the assumption an explicit hypothesis:
    D_5 = 1 for groups of order 2^11, class at most 3 and rank at least 8, assuming the paper's
    computer result for order 2^10 (Proposition 5.7, D_5 form, assuming Proposition 5.3).
    One compared result is not in the paper: D_5(Q) = 1 for every finite group Q of class at
    most 4 with Q/γ_2(Q) ≅ C_3 × C_9 × C_9, with no condition on γ_4(Q) (in particular for
    γ_4(Q) ≅ C_9, which the paper's Theorem 6.11 does not cover); its proof on paper is in the
    author's research notes (public account: docs/ab399.md), and the paper is not being changed
    to include it.
  authors:
    - "Stanislav Vorobev"
  license: "MIT"
  responsible_maintainers:
    - "Stanislav Vorobev"

classification:
  arxiv: ["math.GR"]
  msc2020: ["20F14", "20D15", "20C05", "16S34"]

