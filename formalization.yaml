    - source: "Proposition 5.7 (D_5 form)"
      lean: "GroupDimension.Palomar.D_five_eq_bot_of_rank"
      module: "Challenge"
      status: "proved, conditional"
      note: "Hypotheses: D_3 = γ_3 and Proposition 5.3 for order 2^10 (a computer result in the paper)."

acknowledgements: "Mathlib."
