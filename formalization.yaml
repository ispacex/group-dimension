    authors: ["Stanislav Vorobev"]
    type: paper
    id: "https://ispacex.github.io/d5/paper/d5.pdf"
    location: "Theorems 6.6, 6.8, 6.9, 6.10, 6.11 and D.1; Lemmas 5.2 (a)-(c) and 5.6; Proposition 5.7 (candidate form and D_5 form); Proposition 2.1 (1) ⇔ (3)"
    relationship: formalizes
    note: >-
      The paper and this formalization were developed together. The version cited is the one
