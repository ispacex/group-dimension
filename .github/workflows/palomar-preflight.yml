# Palomar's complete mechanical preflight (https://submit.palomar-registry.org/llms.txt):
# the reusable verification workflow, mode full, profile palomar-standard-v1, on this exact
# commit. A submission to Palomar is made only for a commit whose report says `status: pass`.
name: Palomar preflight
on:
  push:
    paths:
      - Challenge.lean
      - Solution.lean
      - comparator.json
      - formalization.yaml
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - LICENSE
      - 'GroupDimension/**'
      - GroupDimension.lean
      - .github/workflows/palomar-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@c02bbeaed888df45c4e28c4e99dba540ad21552a
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: c02bbeaed888df45c4e28c4e99dba540ad21552a
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
